name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check Python syntax
        run: uv run python -m compileall -q AbletonBridge_Remote_Script MCP_Server elevenlabs_mcp tests

      - name: Run tests
        run: env -u PYTHONPATH uv run pytest -q

      - name: Check whitespace in committed files
        run: git diff --check HEAD~1..HEAD || git diff --check
